name: Publish to npm

# Releases are cut by pushing a version tag:
#   npm version <patch|minor|major>   # writes package.json + creates the tag
#   git push origin main --follow-tags
#
# The token lives in the NPM_TOKEN repo secret rather than on a developer's
# laptop. It must be a **classic Automation** token — the account has 2FA, and
# any other token type makes `npm publish` fail with EOTP in a non-interactive
# environment.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  NODE_VERSION: '22'

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          # Required for NODE_AUTH_TOKEN to be written into .npmrc.
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # A tag that disagrees with package.json would publish a version nobody
      # can find from the git history. Fail loudly instead.
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "Publishing $PKG_VERSION"

      - name: Show package contents
        run: npm pack --dry-run

      # `--access public` is required: the package is scoped and package.json
      # sets no publishConfig, so npm would otherwise default to restricted.
      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
