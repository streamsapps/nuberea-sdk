name: Publish to npm

# Releases are cut by pushing a version tag:
#   npm version <patch|minor|major>   # writes package.json + creates the tag
#   git push origin main --follow-tags
#
# Authentication is npm Trusted Publishing (OIDC) — the same trusted-publisher
# model Hugging Face uses. There is no npm token: the job mints a short-lived
# OIDC token that npm exchanges for a scoped, single-publish credential. That
# also sidesteps EOTP, which any long-lived token hits in CI unless it is
# specifically a classic Automation token.
#
# Requires a trusted publisher configured at
#   npmjs.com → @nuberea/sdk → Settings → Trusted Publisher
# with organization `streamsapps`, repository `nuberea-sdk`, and workflow
# filename `publish.yml`. All fields are case-sensitive, and npm does not
# validate them when saved — a mismatch only surfaces here as ENEEDAUTH.
#
# Provenance attestations are generated automatically (public repo + public
# package + OIDC), so no --provenance flag is needed.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Trusted publishing needs npm >= 11.5.1, which ships with Node 24. Node 22
# still bundles npm 10 and would fail to authenticate.
env:
  NODE_VERSION: '24'

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # Mint the OIDC token npm exchanges to publish.

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # Never cache in a release build.

      - name: Show toolchain versions
        run: |
          node -v
          npm -v

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # A tag that disagrees with package.json would publish a version nobody
      # can find from the git history. Fail loudly instead.
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "Publishing $PKG_VERSION"

      - name: Show package contents
        run: npm pack --dry-run

      # `--access public` is required: the package is scoped and package.json
      # sets no publishConfig, so npm would otherwise default to restricted.
      # No token env: authentication is OIDC via the trusted publisher.
      - name: Publish
        run: npm publish --access public
